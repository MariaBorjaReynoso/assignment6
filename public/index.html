<!DOCTYPE html>
<!--
  Name: Maria Reynoso
  Date: 11/19/2026
  CSC 372-01

  Frontend interface for Triviabook allowing users to browse topics,
  filter questions, play random trivia, and add new questions.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triviabook</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Triviabook</h1>
    <p>Your hub for quick trivia challenges and custom questions</p>
  </header>

  <main>
    <!-- Random Trivia Game Section -->
    <section class="card" id="random-section">
      <h2>Random Trivia Challenge</h2>
      <button id="random-btn" type="button">Get Random Question</button>
      <div id="random-question-box" class="hidden">
        <p class="badge" id="random-meta"></p>
        <p class="question-text" id="random-question-text"></p>
        <form id="guess-form">
          <input type="text" id="guess-input" placeholder="Type your answer..." required>
          <button type="submit">Check Answer</button>
        </form>
        <p id="guess-feedback"></p>
      </div>
    </section>

    <!-- Browse Questions by Topic Section -->
    <section class="card" id="browse-section">
      <h2>Browse Questions by Topic</h2>
      <div class="controls">
        <label for="topic-select">Topic:</label>
        <select id="topic-select"></select>

        <label for="difficulty-select">Difficulty:</label>
        <select id="difficulty-select">
          <option value="">All</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>

        <label for="limit-input">Limit:</label>
        <input type="number" id="limit-input" min="1" placeholder="All">

        <button id="filter-btn" type="button">Load Questions</button>
      </div>
      <div id="questions-container"></div>
    </section>

    <!-- Add New Question Section -->
    <section class="card" id="add-section">
      <h2>Add a New Question</h2>
      <form id="add-question-form">
        <div class="form-group">
          <label for="new-topic">Topic:</label>
          <input type="text" id="new-topic" placeholder="e.g., science, movies" required>
        </div>
        <div class="form-group">
          <label for="new-question">Question:</label>
          <input type="text" id="new-question" placeholder="Enter trivia question" required>
        </div>
        <div class="form-group">
          <label for="new-answer">Answer:</label>
          <input type="text" id="new-answer" placeholder="Enter answer" required>
        </div>
        <div class="form-group">
          <label for="new-difficulty">Difficulty:</label>
          <select id="new-difficulty" required>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <button type="submit">Add Question</button>
      </form>
      <p id="add-feedback"></p>
    </section>
  </main>
</body>
</html>
